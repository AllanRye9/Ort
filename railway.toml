# Railway deployment configuration for Ort Marketplace
# Docs: https://docs.railway.com/reference/config-as-code

[build]
# Use the Dockerfile in src/ — Railway resolves this relative to the repo root.
builder = "dockerfile"
dockerfilePath = "src/dockerfile"

[deploy]
# Do NOT set startCommand here — let the Dockerfile CMD handle it.
# Railway injects $PORT automatically; the CMD uses ${PORT:-8080}.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
