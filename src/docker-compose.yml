# Local development docker-compose.
# For Railway production, use railway.toml + the Railway PostgreSQL add-on.

services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ort_api
    command: >
      sh -c "gunicorn -k uvicorn.workers.UvicornWorker app.main:app
             --bind 0.0.0.0:8000 --workers 2 --timeout 120
             --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: ort_db
    environment:
      POSTGRES_DB: ort_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  postgres_data:
    driver: local
