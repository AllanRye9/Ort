name: Prisma PostgreSQL Migration Management

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/prisma/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/prisma/**'

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: backend

jobs:
  # ── Job 1: Detect schema drift and auto-generate a migration file (PRs only) ──
  detect-and-create-migration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prisma_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prisma_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # BUG FIX: the original echoed `${{ steps.find_schema.outputs.* }}`
      # from inside this same step — a step's own outputs aren't populated
      # until after it finishes, so that line always printed blank. Echo the
      # local shell variable instead.
      - name: Find Prisma Schema
        id: find_schema
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            SCHEMA_PATH="prisma/schema.prisma"
          elif [ -f "prisma/contract.prisma" ]; then
            SCHEMA_PATH="prisma/contract.prisma"
          elif [ -f "schema.prisma" ]; then
            SCHEMA_PATH="schema.prisma"
          else
            echo "❌ No Prisma schema found!"
            exit 1
          fi
          echo "schema_path=$SCHEMA_PATH" >> "$GITHUB_OUTPUT"
          echo "Found schema: $SCHEMA_PATH"

      - name: Check Schema Drift
        id: check_drift
        env:
          DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"

          # Apply existing committed migrations first (no-op if there are none).
          npx prisma migrate deploy --schema="$SCHEMA"

          # BUG FIX: `migrate diff --exit-code` is not a plain boolean —
          # it exits 0 (no diff), 2 (diff found), or something else on a
          # genuine error (bad connection, invalid schema, etc). The
          # original `if ! cmd; then drift=true` treated all three the
          # same, so a transient DB error would be silently reported as
          # "drift detected" and go on to generate a bogus migration.
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel "$SCHEMA" \
            --exit-code
          DIFF_EXIT=$?
          set -e

          if [ "$DIFF_EXIT" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "✅ No drift detected"
          elif [ "$DIFF_EXIT" -eq 2 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Schema drift detected"
          else
            echo "::error::prisma migrate diff failed unexpectedly (exit $DIFF_EXIT) — not a drift result, treating as a hard failure."
            exit "$DIFF_EXIT"
          fi

      # BUG FIX: the original manually created a `prisma_test_db_shadow`
      # database with `psql` and no PGPASSWORD set — that hangs waiting for
      # a password in non-interactive CI. It was also dead code: this repo's
      # schema.prisma datasource block never declares `shadowDatabaseUrl`,
      # so Prisma ignores SHADOW_DATABASE_URL and manages its own transient
      # shadow database automatically (the `postgres` role in the service
      # container has CREATEDB rights, so this just works with no setup).
      - name: Generate Migration File
        if: steps.check_drift.outputs.drift == 'true'
        env:
          DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
          npx prisma migrate dev \
            --name "auto_migration_$(date +%Y%m%d_%H%M%S)" \
            --create-only \
            --schema="$SCHEMA"

      # BUG FIX: pushing back to the PR branch only works for PRs from
      # branches in this same repo — GITHUB_TOKEN can never push to a
      # fork. The original had no guard for this and would just fail on
      # every external contributor's PR. Skip with a clear message instead.
      - name: Commit Migration
        if: steps.check_drift.outputs.drift == 'true'
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "## ⚠️ Schema drift detected, but this PR is from a fork" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Actions cannot push commits back to a fork. Run \`npx prisma migrate dev --schema=$SCHEMA\` locally and commit the generated migration yourself." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add prisma/migrations/
          if git diff --staged --quiet; then
            echo "No migration files to commit"
          else
            git commit -m "chore(db): auto-generate migration [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"

            echo "✅ Migration files have been generated and pushed to this branch." >> "$GITHUB_STEP_SUMMARY"
            echo "📝 Please review the migration before merging to main." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Job 2: Deploy migrations to staging (develop branch) ──────────────────
  deploy-migrations-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    concurrency:
      group: staging-migration
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Find Prisma Schema
        id: find_schema
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            SCHEMA_PATH="prisma/schema.prisma"
          elif [ -f "prisma/contract.prisma" ]; then
            SCHEMA_PATH="prisma/contract.prisma"
          else
            SCHEMA_PATH="prisma/schema.prisma"
          fi
          echo "schema_path=$SCHEMA_PATH" >> "$GITHUB_OUTPUT"
          echo "Found schema: $SCHEMA_PATH"

      - name: Validate Staging Database URL
        id: validate_staging_url
        run: |
          if [ -z "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "❌ STAGING_DATABASE_URL secret is not set!"
            exit 1
          fi
          echo "✅ STAGING_DATABASE_URL is configured"

      - name: Deploy Migrations to Staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
          echo "🚀 Deploying migrations to staging..."
          npx prisma migrate deploy --schema="$SCHEMA"
          npx prisma generate --schema="$SCHEMA"

      - name: Verify Staging Migration
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel "$SCHEMA" \
            --exit-code
          DIFF_EXIT=$?
          set -e

          if [ "$DIFF_EXIT" -eq 0 ]; then
            echo "✅ Staging schema verified"
          else
            echo "❌ Staging schema verification failed (exit $DIFF_EXIT)!"
            exit 1
          fi

  # ── Job 3: Guarded deploy to production (main branch) ─────────────────────
  deploy-migrations-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-migration
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Find Prisma Schema
        id: find_schema
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            SCHEMA_PATH="prisma/schema.prisma"
          elif [ -f "prisma/contract.prisma" ]; then
            SCHEMA_PATH="prisma/contract.prisma"
          else
            SCHEMA_PATH="prisma/schema.prisma"
          fi
          echo "schema_path=$SCHEMA_PATH" >> "$GITHUB_OUTPUT"
          echo "Found schema: $SCHEMA_PATH"

      - name: Validate Production Database URL
        id: validate_prod_url
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "❌ PRODUCTION_DATABASE_URL secret is not set!"
            exit 1
          fi
          echo "✅ PRODUCTION_DATABASE_URL is configured"

      # BUG FIX: the original grepped for "no pending migrations|schema is
      # up to date" — neither phrase is what Prisma actually prints. The
      # real "nothing pending" string is exactly "Database schema is up to
      # date!", so the old check always fell through to has_migrations=true,
      # meaning every push ran the full diff/preview/deploy path even when
      # nothing had changed.
      - name: Check for Pending Migrations
        id: check_migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"

          set +e
          MIGRATION_STATUS=$(npx prisma migrate status --schema="$SCHEMA" 2>&1)
          STATUS_EXIT=$?
          set -e
          echo "$MIGRATION_STATUS"

          if echo "$MIGRATION_STATUS" | grep -q "Database schema is up to date"; then
            echo "✅ No pending migrations"
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS_EXIT" -ne 0 ] && ! echo "$MIGRATION_STATUS" | grep -q "have not yet been applied"; then
            echo "::error::prisma migrate status failed unexpectedly — check PRODUCTION_DATABASE_URL / DB connectivity."
            exit "$STATUS_EXIT"
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "📋 Pending migrations detected"
          fi

      # BUG FIX: `--script > file 2>&1` merged stderr into the SQL file that
      # gets grep'd for destructive ops and pasted into the job summary — a
      # stray warning could corrupt the SQL or skew that check. stdout and
      # stderr are now kept separate.
      - name: Generate Migration Preview
        if: steps.check_migrations.outputs.has_migrations == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"

          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel "$SCHEMA" \
            --script > migration_preview.sql 2> migration_preview.stderr.log || true

          if [ -s migration_preview.stderr.log ]; then
            echo "::warning::prisma migrate diff wrote to stderr while generating the preview:"
            cat migration_preview.stderr.log
          fi

          echo "## 📋 Migration Preview" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          cat migration_preview.sql >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check for Destructive Operations
        id: check_destructive
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          if grep -qiE "drop table|drop column|alter table.*drop|truncate" migration_preview.sql; then
            echo "⚠️ Destructive operations detected!"
            echo "destructive=true" >> "$GITHUB_OUTPUT"

            echo "## 🚨 Destructive Migration Detected" >> "$GITHUB_STEP_SUMMARY"
            echo "This migration contains destructive operations (DROP TABLE/COLUMN, TRUNCATE)." >> "$GITHUB_STEP_SUMMARY"
            echo "Please review manually before proceeding." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "destructive=false" >> "$GITHUB_OUTPUT"
            echo "✅ No destructive operations detected"
          fi

      - name: Require Manual Approval for Destructive Changes
        if: steps.check_migrations.outputs.has_migrations == 'true' && steps.check_destructive.outputs.destructive == 'true'
        run: |
          echo "❌ Destructive migrations require manual approval."
          echo "Please review the migration preview in the step summary."
          exit 1

      - name: Deploy Migrations to Production
        if: steps.check_migrations.outputs.has_migrations == 'true' && steps.check_destructive.outputs.destructive != 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
          echo "🚀 Deploying migrations to production..."
          npx prisma migrate deploy --schema="$SCHEMA"
          npx prisma generate --schema="$SCHEMA"
          echo "✅ Migrations deployed successfully"

      - name: Verify Production Migration
        if: steps.check_migrations.outputs.has_migrations == 'true' && steps.check_destructive.outputs.destructive != 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel "$SCHEMA" \
            --exit-code
          DIFF_EXIT=$?
          set -e

          if [ "$DIFF_EXIT" -eq 0 ]; then
            echo "✅ Production schema verified successfully"
          else
            echo "❌ Production schema verification failed (exit $DIFF_EXIT)!"
            exit 1
          fi

      - name: Skip Production Deployment (No Migrations)
        if: steps.check_migrations.outputs.has_migrations == 'false'
        run: echo "✅ No pending migrations — nothing to deploy."
