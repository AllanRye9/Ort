name: Prisma PostgreSQL Migration Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Ensure the workflow has write permissions to push code changes back
permissions:
  contents: write

jobs:
  postgres-prisma-sync:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prisma_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout:v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref }} # Check out the actual PR branch, not a detached HEAD

    - name: Setup Node.js
      uses: actions/setup-node:v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Check for Unsaved PostgreSQL Schema Changes
      id: check_drift
      env:
        DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db
      run: |
        # 1. Apply existing migrations to the local test database
        npx prisma migrate deploy
        
        # 2. Check if schema.prisma has unmigrated changes
        if ! npx prisma migrate diff --from-local-migration-directories prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code; then
          echo "drift=true" >> $GITHUB_OUTPUT
          echo "⚠️ PostgreSQL schema mismatch found. Missing migrations detected."
        else
          echo "drift=false" >> $GITHUB_OUTPUT
          echo "✅ PostgreSQL schema matches existing migrations."
        fi

    - name: Create Missing Migration Files
      if: steps.check_drift.outputs.drift == 'true'
      env:
        DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db
      run: |
        npx prisma migrate dev --name auto-postgres-migration --create-only

    - name: Commit and Push Missing Migrations
      if: steps.check_drift.outputs.drift == 'true' && github.event_name == 'pull_request'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add prisma/migrations/
        git commit -m "chore(db): auto-generate postgres migrations [skip ci]"
        git push origin HEAD:${{ github.head_ref }}

    - name: Apply Migrations to Target Environment
      if: github.event_name == 'push'
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: npx prisma migrate deploy
