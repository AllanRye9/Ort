name: Prisma PostgreSQL Migration Management

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: Detect and create migrations (only in PRs)
  detect-and-create-migration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prisma_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Find Prisma Schema
      id: find_schema
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          echo "schema_path=prisma/schema.prisma" >> $GITHUB_OUTPUT
        elif [ -f "prisma/contract.prisma" ]; then
          echo "schema_path=prisma/contract.prisma" >> $GITHUB_OUTPUT
        elif [ -f "schema.prisma" ]; then
          echo "schema_path=schema.prisma" >> $GITHUB_OUTPUT
        else
          echo "❌ No Prisma schema found!"
          exit 1
        fi

    - name: Check Schema Drift
      id: check_drift
      env:
        DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        
        # Apply existing migrations
        npx prisma migrate deploy --schema="$SCHEMA"
        
        # Check for drift
        if ! npx prisma migrate diff \
          --from-migrations prisma/migrations \
          --to-schema-datamodel "$SCHEMA" \
          --exit-code; then
          echo "drift=true" >> $GITHUB_OUTPUT
          echo "⚠️ Schema drift detected"
        else
          echo "drift=false" >> $GITHUB_OUTPUT
          echo "✅ No drift detected"
        fi

    - name: Generate Migration File
      if: steps.check_drift.outputs.drift == 'true'
      env:
        DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db
        SHADOW_DATABASE_URL: postgresql://postgres:local_secure_password@localhost:5432/prisma_test_db_shadow
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        
        # Create shadow DB
        psql -h localhost -U postgres -c "CREATE DATABASE prisma_test_db_shadow;" || true
        
        # Generate migration
        npx prisma migrate dev \
          --name auto_migration_$(date +%Y%m%d_%H%M%S) \
          --create-only \
          --schema="$SCHEMA"

    - name: Commit Migration
      if: steps.check_drift.outputs.drift == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add prisma/migrations/
        if git diff --staged --quiet; then
          echo "No migration files to commit"
        else
          git commit -m "chore(db): auto-generate migration [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
          
          echo "✅ Migration files have been generated and pushed to this branch." >> $GITHUB_STEP_SUMMARY
          echo "📝 Please review the migration before merging to main." >> $GITHUB_STEP_SUMMARY
        fi

  # Job 2: Staging deployment (develop branch)
  deploy-migrations-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Find Prisma Schema
      id: find_schema
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          echo "schema_path=prisma/schema.prisma" >> $GITHUB_OUTPUT
        elif [ -f "prisma/contract.prisma" ]; then
          echo "schema_path=prisma/contract.prisma" >> $GITHUB_OUTPUT
        else
          echo "schema_path=prisma/schema.prisma" >> $GITHUB_OUTPUT
        fi

    - name: Deploy Migrations to Staging
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        npx prisma migrate deploy --schema="$SCHEMA"
        npx prisma generate --schema="$SCHEMA"

    - name: Verify Staging Migration
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        if ! npx prisma migrate diff \
          --from-migrations prisma/migrations \
          --to-schema-datamodel "$SCHEMA" \
          --exit-code; then
          echo "❌ Staging schema verification failed!"
          exit 1
        fi
        echo "✅ Staging schema verified"

  # Job 3: Safe production deployment (only on main branch)
  deploy-migrations-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency: 
      group: production-migration
      cancel-in-progress: false
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Find Prisma Schema
      id: find_schema
      run: |
        if [ -f "prisma/schema.prisma" ]; then
          echo "schema_path=prisma/schema.prisma" >> $GITHUB_OUTPUT
        elif [ -f "prisma/contract.prisma" ]; then
          echo "schema_path=prisma/contract.prisma" >> $GITHUB_OUTPUT
        else
          echo "schema_path=prisma/schema.prisma" >> $GITHUB_OUTPUT
        fi

    - name: Validate Migration Safety
      id: validate_migration
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        
        # Get migration status without unsupported flags
        MIGRATION_STATUS=$(npx prisma migrate status --schema="$SCHEMA" 2>&1)
        echo "$MIGRATION_STATUS"
        
        # Check for pending migrations
        if echo "$MIGRATION_STATUS" | grep -qi "no pending migrations"; then
          echo "✅ No pending migrations"
          echo "has_migrations=false" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "has_migrations=true" >> $GITHUB_OUTPUT
          echo "📋 Pending migrations detected" >> $GITHUB_STEP_SUMMARY
          echo "$MIGRATION_STATUS" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for destructive operations
        echo "⚠️ Review the following migrations:"
        npx prisma migrate diff \
          --from-migrations prisma/migrations \
          --to-schema-datamodel "$SCHEMA" \
          --script > migration_preview.sql
        
        if grep -q "DROP TABLE\|DROP COLUMN\|ALTER TABLE.*DROP\|TRUNCATE" migration_preview.sql; then
          echo "⚠️ Destructive operations detected!"
          echo "destructive=true" >> $GITHUB_OUTPUT
        else
          echo "destructive=false" >> $GITHUB_OUTPUT
        fi

    - name: Manual Approval Required for Destructive Changes
      if: steps.validate_migration.outputs.destructive == 'true'
      run: |
        echo "## 🚨 Destructive Migration Detected" >> $GITHUB_STEP_SUMMARY
        echo "This migration contains destructive operations (DROP TABLE/COLUMN, TRUNCATE)." >> $GITHUB_STEP_SUMMARY
        echo "Please review manually before proceeding." >> $GITHUB_STEP_SUMMARY
        exit 1

    - name: Backup Database
      if: steps.validate_migration.outputs.has_migrations == 'true'
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        echo "📦 Creating backup..."
        # Add your backup logic here
        # Example: pg_dump $DATABASE_URL > backup_$(date +%Y%m%d_%H%M%S).sql

    - name: Deploy Migrations to Production
      if: steps.validate_migration.outputs.has_migrations == 'true'
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        echo "🚀 Deploying migrations to production..."
        npx prisma migrate deploy --schema="$SCHEMA"
        npx prisma generate --schema="$SCHEMA"
        echo "✅ Migrations deployed successfully"

    - name: Verify Production Migration
      if: steps.validate_migration.outputs.has_migrations == 'true'
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        SCHEMA="${{ steps.find_schema.outputs.schema_path }}"
        if ! npx prisma migrate diff \
          --from-migrations prisma/migrations \
          --to-schema-datamodel "$SCHEMA" \
          --exit-code; then
          echo "❌ Production schema verification failed!"
          exit 1
        fi
        echo "✅ Production schema verified successfully"

    - name: Rollback on Failure
      if: failure() && steps.validate_migration.outputs.has_migrations == 'true'
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        echo "⚠️ Migration failed, initiating rollback..."
        # Add rollback logic here if needed
