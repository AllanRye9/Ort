name: Update Dependencies

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:

jobs:
  update-root:
    name: Update Root Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update root package dependencies
        uses: taichi/actions-package-update@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Allan Rye
          GIT_AUTHOR_EMAIL: allan.rye.9999@gmail.com
        with:
          execute: 'npm update'

  update-frontend:
    name: Update Frontend Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update frontend package dependencies
        uses: taichi/actions-package-update@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Allan Rye
          GIT_AUTHOR_EMAIL: allan.rye.9999@gmail.com
        with:
          execute: 'npm update --prefix frontend'

  update-backend:
    name: Update Backend Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update backend package dependencies
        uses: taichi/actions-package-update@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Allan Rye
          GIT_AUTHOR_EMAIL: allan.rye.9999@gmail.com
        with:
          execute: 'npm update --prefix backend'
